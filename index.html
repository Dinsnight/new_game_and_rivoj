    <script>
        class SoundEngine {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playBeep(freq = 440, type = 'sine', duration = 0.1) {
                try {
                    this.init();
                    if (this.ctx.state === 'suspended') this.ctx.resume();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e){}
            }
            playCorrect() {
                this.playBeep(523.25, 'sine', 0.1);
                setTimeout(() => this.playBeep(659.25, 'sine', 0.15), 100);
                setTimeout(() => this.playBeep(783.99, 'sine', 0.2), 200);
            }
            playWrong() {
                this.playBeep(220, 'sawtooth', 0.15);
                setTimeout(() => this.playBeep(180, 'sawtooth', 0.25), 150);
            }
            playCoin() {
                this.playBeep(987.77, 'sine', 0.08);
                setTimeout(() => this.playBeep(1318.51, 'sine', 0.15), 80);
            }
            playJump() {
                this.playBeep(300, 'square', 0.08);
            }
            playGameOver() {
                this.playBeep(300, 'sawtooth', 0.2);
                setTimeout(() => this.playBeep(200, 'sawtooth', 0.2), 200);
                setTimeout(() => this.playBeep(100, 'sawtooth', 0.4), 400);
            }
        }
        const sounds = new SoundEngine();
    </script>

    <script>
        const state = {
            lang: localStorage.getItem('eduplay_lang') || 'uz',
            mode: 'edu', // 'edu' or 'arcade'
            theme: localStorage.getItem('eduplay_theme') || 'dark',
            stats: JSON.parse(localStorage.getItem('eduplay_stats')) || {
                score: 0,
                stars: 0,
                streak: 1,
                completedModules: []
            },
            currentGrade: 5,
            activeQuiz: null,
            quizStep: 0,
            quizScore: 0,
            highScores: JSON.parse(localStorage.getItem('eduplay_highscores')) || {
                typing: 0,
                flappy: 0,
                memory: 0,
                snake: 0
            }
        };

        function saveState() {
            localStorage.setItem('eduplay_lang', state.lang);
            localStorage.setItem('eduplay_theme', state.theme);
            localStorage.setItem('eduplay_stats', JSON.stringify(state.stats));
            localStorage.setItem('eduplay_highscores', JSON.stringify(state.highScores));
        }

        function t(key) {
            return TRANSLATIONS[state.lang][key] || key;
        }

        function setLanguage(lang) {
            state.lang = lang;
            saveState();
            renderApp();
        }

        function setMode(mode) {
            state.mode = mode;
            renderApp();
        }

        function toggleTheme() {
            state.theme = state.theme === 'dark' ? 'light' : 'dark';
            saveState();
            applyTheme();
        }

        function applyTheme() {
            if (state.theme === 'light') {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('light');
                document.body.classList.remove('bg-slate-950', 'text-slate-100');
                document.body.classList.add('bg-slate-100', 'text-slate-900');
            } else {
                document.documentElement.classList.remove('light');
                document.documentElement.classList.add('dark');
                document.body.classList.remove('bg-slate-100', 'text-slate-900');
                document.body.classList.add('bg-slate-950', 'text-slate-100');
            }
        }
    </script>

        function renderApp() {

            document.getElementById('statStars').innerText = state.stats.stars;

            document.getElementById('themeIcon').className = state.theme === 'dark' ? "fa-solid fa-moon" : "fa-solid fa-sun text-amber-500";

            const container = document.getElementById('appContainer');
            container.innerHTML = '';

            if (state.mode === 'edu') {
                if (state.activeQuiz) {
                    renderQuizView(container);
                } else {
                    renderEduView(container);
                }
            } else if (state.mode === 'arcade') {
                renderArcadeView(container);
            }
        }

        function renderEduView(container) {
            let html = `
                <div class="flex flex-col gap-6">
                    <!-- Grade Selection Bar -->
                    <div class="flex items-center justify-between flex-wrap gap-4 glass p-4 rounded-2xl">
                        <div>
                            <h2 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-brand-400 to-accent-purple flex items-center gap-2">
                                <i class="fa-solid fa-book-open text-brand-400"></i> ${t('eduMode')}
                            </h2>
                            <p class="text-xs text-slate-400 mt-0.5">${t('selectGrade')}</p>
                        </div>

            [5, 6, 7, 8, 9, 10].forEach(grade => {

                        <i class="fa-solid fa-layer-group text-xs"></i> ${grade}${t('gradePrefix')}

                        </div>
                    </div>

                    <!-- Lessons Grid for Selected Grade -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            `;

                html += `<div class="col-span-full p-8 text-center text-slate-400 glass rounded-2xl">Darslar tez orada qo'shiladi... / Уроки скоро будут добавлены...</div>`;

                    const isCompleted = state.stats.completedModules.includes(mod.id);

                                </div>

                                <p class="text-xs text-slate-400 mb-6 leading-relaxed">${mod.desc[state.lang]}</p>
                            </div>

                            <div class="flex items-center justify-between pt-4 border-t border-white/10">
                                <span class="text-xs font-semibold text-brand-400 flex items-center gap-1">
                                    <i class="fa-solid fa-list-check"></i> ${mod.questions.length} ${t('question')}

                                <button onclick="startQuiz('${mod.id}')" class="px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-bold text-xs shadow-md hover:shadow-brand-500/40 transition-all flex items-center gap-2">

        function selectGrade(g) {
            sounds.playBeep(600, 'sine', 0.05);
            state.currentGrade = g;
            renderApp();
        }

        function startQuiz(moduleId) {
            sounds.playBeep(800, 'sine', 0.08);
            const gradeMods = CURRICULUM[state.currentGrade] || [];
            const mod = gradeMods.find(m => m.id === moduleId);
            if (mod) {
                state.activeQuiz = mod;
                state.quizStep = 0;
                state.quizScore = 0;
                renderApp();
            }

    <script>
        function renderQuizView(container) {
            const mod = state.activeQuiz;
            const q = mod.questions[state.quizStep];

            if (state.quizStep >= mod.questions.length) {
                // Quiz Completed Summary
                const total = mod.questions.length;
                const percentage = Math.round((state.quizScore / total) * 100);
                let starsEarned = 1;
                if (percentage >= 80) starsEarned = 3;
                else if (percentage >= 50) starsEarned = 2;

                // Award points
                if (!state.stats.completedModules.includes(mod.id)) {
                    state.stats.completedModules.push(mod.id);
                    state.stats.score += state.quizScore * 10;
                    state.stats.stars += starsEarned;
                    state.stats.streak += 1;
                    saveState();
                }

                container.innerHTML = `
                    <div class="max-w-md mx-auto my-auto w-full glass p-8 rounded-3xl text-center flex flex-col items-center gap-6 shadow-2xl">
                        <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-amber-400 to-yellow-300 flex items-center justify-center text-4xl text-slate-950 shadow-lg glow-effect">
                            <i class="fa-solid fa-trophy"></i>
                        </div>
                        <div>
                            <h2 class="text-2xl font-extrabold text-white">${t('congrats')}</h2>
                            <p class="text-xs text-slate-400 mt-1">${mod.title[state.lang]}</p>
                        </div>

                        <!-- Stars -->
                        <div class="flex items-center gap-2 text-3xl text-amber-400">
                            <i class="fa-solid fa-star ${starsEarned >= 1 ? 'opacity-100' : 'opacity-20'}"></i>
                            <i class="fa-solid fa-star ${starsEarned >= 2 ? 'opacity-100 scale-110' : 'opacity-20'}"></i>
                            <i class="fa-solid fa-star ${starsEarned >= 3 ? 'opacity-100' : 'opacity-20'}"></i>
                        </div>

                        <div class="bg-slate-900/60 p-4 rounded-2xl w-full flex items-center justify-around border border-white/10">
                            <div>
                                <div class="text-xs text-slate-400">${t('correctAnswers')}</div>
                                <div class="text-xl font-extrabold text-brand-400">${state.quizScore} / ${total}</div>
                            </div>
                            <div class="h-8 w-px bg-white/10"></div>
                            <div>
                                <div class="text-xs text-slate-400">${t('points')}</div>
                                <div class="text-xl font-extrabold text-emerald-400">+${state.quizScore * 10}</div>
                            </div>
                        </div>

                        <button onclick="finishQuiz()" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-brand-500 to-brand-600 text-white font-bold shadow-lg hover:shadow-brand-500/40 transition-all flex items-center justify-center gap-2">
                            <i class="fa-solid fa-arrow-left"></i> ${t('backToLessons')}
                        </button>
                    </div>
                `;
                return;
            }

            // Active Quiz Question View
            let html = `
                <div class="max-w-2xl mx-auto w-full flex flex-col gap-6 my-auto">
                    <!-- Progress Bar -->
                    <div class="flex items-center justify-between text-xs font-semibold text-slate-400 mb-1">
                        <span>${mod.title[state.lang]}</span>
                        <span>${t('question')} ${state.quizStep + 1} / ${mod.questions.length}</span>
                    </div>
                    <div class="w-full bg-slate-800 rounded-full h-2.5 overflow-hidden">
                        <div class="bg-gradient-to-r from-brand-500 to-accent-purple h-2.5 rounded-full transition-all duration-300" style="width: ${((state.quizStep + 1) / mod.questions.length) * 100}%"></div>
                    </div>

                    <!-- Question Card -->
                    <div class="glass p-6 sm:p-8 rounded-3xl shadow-xl flex flex-col gap-6 border border-white/15">
                        <h3 class="text-lg sm:text-xl font-bold text-white leading-relaxed">
                            <span class="text-brand-400 mr-2">Q${state.quizStep + 1}.</span> ${q.q[state.lang]}
                        </h3>

                        <div class="grid grid-cols-1 gap-3">
            `;

            q.options[state.lang].forEach((opt, idx) => {
                html += `
                    <button onclick="handleAnswer(${idx})" class="w-full text-left p-4 rounded-2xl bg-slate-800/70 hover:bg-brand-600/30 hover:border-brand-400 border border-white/10 text-sm font-semibold text-slate-200 transition-all flex items-center justify-between group">
                        <span>${opt}</span>
                        <i class="fa-regular fa-circle text-slate-500 group-hover:text-brand-400 group-hover:fa-solid group-hover:fa-circle-check transition-all"></i>
                    </button>
                `;
            });

            html += `
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        function handleAnswer(selectedIdx) {
            const mod = state.activeQuiz;
            const q = mod.questions[state.quizStep];

            if (selectedIdx === q.answer) {
                sounds.playCorrect();
                state.quizScore++;
            } else {
                sounds.playWrong();
            }

            state.quizStep++;
            renderApp();
        }

        function finishQuiz() {
            sounds.playBeep(500, 'sine', 0.05);
            state.activeQuiz = null;
            renderApp();
        }

    <script>
        let typingGameInterval = null;
        function launchTypingGame() {
            const container = document.getElementById('appContainer');
            const words = ["PYTHON", "BIT", "BYTE", "WORD", "EXCEL", "RAM", "CPU", "HTML", "CSS", "CODE", "DATA", "WIFI", "DISK", "PING", "ODINA", "SAIDHOJA", "ESMIN", "MIRZOHIR", "ABDUOISHOX", "AZIZA", "ZIYODA", "SUPERCALIFRAGILISTICEXPIALIDOCIOUSMALAK","MALAKISTHEBEST","PETRICHOR","EXAGGERATE","FLAWLESS","MIRAZIZ", "ABDULAZIZ", "ELEKTROSHITOK","PORTUGAL","UMIDJON"];
            let currentWord = "";
            let score = 0;
            let timeLeft = 60;

            container.innerHTML = `
                <div class="max-w-xl mx-auto w-full glass p-8 rounded-3xl flex flex-col items-center gap-6 my-auto text-center relative overflow-hidden">
                    <button onclick="renderApp()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                    <h3 class="text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-cyan-300">
                        <i class="fa-solid fa-keyboard mr-2"></i> ${t('gameTitle1')}
                    </h3>

                    <div class="flex items-center justify-between w-full bg-slate-900/60 p-4 rounded-2xl border border-white/10">
                        <div class="text-xs text-slate-400">${t('scoreLabel')}: <span id="typeScore" class="text-lg font-bold text-brand-400">0</span></div>
                        <div class="text-xs text-slate-400">Vaqt / Время: <span id="typeTimer" class="text-lg font-bold text-amber-400">30</span>s</div>
                    </div>

                    <div class="w-full py-12 bg-slate-900/90 rounded-2xl border-2 border-brand-500/30 flex items-center justify-center">
                        <span id="targetWord" class="text-4xl sm:text-5xl font-mono font-extrabold tracking-widest text-brand-400 glow-effect">READY</span>
                    </div>

                    <input type="text" id="typingInput" autocomplete="off" placeholder="${t('typeHere')}" class="w-full py-4 px-6 rounded-2xl bg-slate-800 border-2 border-white/20 text-center font-mono text-xl text-white focus:outline-none focus:border-brand-400 uppercase">
                </div>
            `;

            const input = document.getElementById('typingInput');
            const targetEl = document.getElementById('targetWord');
            const scoreEl = document.getElementById('typeScore');
            const timerEl = document.getElementById('typeTimer');

            function nextWord() {
                currentWord = words[Math.floor(Math.random() * words.length)];
                targetEl.innerText = currentWord;
                input.value = "";
            }

            nextWord();
            input.focus();

            input.addEventListener('input', () => {
                if (input.value.trim().toUpperCase() === currentWord) {
                    sounds.playCoin();
                    score += 10;
                    scoreEl.innerText = score;
                    nextWord();
                } else {
                    sounds.playBeep(200, 'sine', 0.03);
                }
            });

            if (typingGameInterval) clearInterval(typingGameInterval);
            typingGameInterval = setInterval(() => {
                timeLeft--;
                timerEl.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(typingGameInterval);
                    sounds.playGameOver();
                    if (score > (state.highScores.typing || 0)) {
                        state.highScores.typing = score;
                        saveState();
                    }
                    container.innerHTML = `
                        <div class="max-w-md mx-auto my-auto w-full glass p-8 rounded-3xl text-center flex flex-col items-center gap-6">
                            <h3 class="text-2xl font-bold text-amber-400">${t('gameOver')}</h3>
                            <p class="text-lg text-white">${t('scoreLabel')}: <span class="font-bold text-brand-400">${score}</span></p>
                            <button onclick="launchTypingGame()" class="px-6 py-3 rounded-xl bg-brand-600 hover:bg-brand-500 font-bold text-white shadow-lg transition-all">
                                ${t('restart')}
                            </button>
                        </div>
                    `;
                }
            }, 1000);
        }
    </script>

                    <div class="text-xs text-slate-400">${t('pressToStart')}</div>
                    <canvas id="flappyCanvas" width="400" height="400" class="w-full max-w-[400px] h-[350px] bg-slate-900 rounded-2xl border border-white/10"></canvas>
                </div>
            `;

            const canvas = document.getElementById('flappyCanvas');
            const ctx = canvas.getContext('2d');

            let byteY = 180;
            let velocity = 0;
            const gravity = 0.35;
            const jump = -6.5;
            let score = 0;
            let pipes = [];
            let isRunning = false;
            let gameOver = false;

            function spawnPipe() {
                const gap = 110;
                const minHeight = 40;
                const topHeight = Math.floor(Math.random() * (canvas.height - gap - minHeight * 2)) + minHeight;
                pipes.push({
                    x: canvas.width,
                    top: topHeight,
                    bottom: canvas.height - topHeight - gap,
                    passed: false
                });
            }

            function doJump() {
                if (!isRunning && !gameOver) {
                    isRunning = true;
                    spawnPipe();
                }
                if (isRunning) {
                    sounds.playJump();
                    velocity = jump;
                }
            }

            window.onkeydown = (e) => { if (e.code === 'Space') doJump(); };
            canvas.onclick = () => doJump();

            function loop() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Background grid lines
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                ctx.lineWidth = 1;
                for (let i = 0; i < canvas.width; i += 20) {
                    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
                }

                if (isRunning) {
                    velocity += gravity;
                    byteY += velocity;

                    if (byteY > canvas.height - 20 || byteY < 0) {
                        endGame();
                    }

                    // Move & Draw Pipes
                    for (let i = pipes.length - 1; i >= 0; i--) {
                        let p = pipes[i];
                        p.x -= 2;

                        // Draw top pipe (Server Tower)
                        ctx.fillStyle = '#a855f7';
                        ctx.fillRect(p.x, 0, 40, p.top);
                        // Pipe cap
                        ctx.fillStyle = '#ec4899';
                        ctx.fillRect(p.x - 2, p.top - 10, 44, 10);

                        // Draw bottom pipe
                        ctx.fillStyle = '#a855f7';
                        ctx.fillRect(p.x, canvas.height - p.bottom, 40, p.bottom);
                        ctx.fillStyle = '#ec4899';
                        ctx.fillRect(p.x - 2, canvas.height - p.bottom, 44, 10);

                        // Check collision
                        if (
                            p.x < 60 && p.x + 40 > 30 &&
                            (byteY - 12 < p.top || byteY + 12 > canvas.height - p.bottom)
                        ) {
                            endGame();
                        }

                        // Score increment
                        if (p.x + 40 < 30 && !p.passed) {
                            p.passed = true;
                            score++;
                            sounds.playCoin();
                        }

                        if (p.x < -50) pipes.splice(i, 1);
                    }

                    if (pipes.length > 0 && pipes[pipes.length - 1].x < canvas.width - 180) {
                        spawnPipe();
                    }
                }

                // Draw Flappy Byte (Chip Icon)
                ctx.fillStyle = '#38bdf8';
                ctx.beginPath();
                ctx.arc(40, byteY, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#0284c7';
                ctx.fillRect(34, byteY - 6, 12, 12);

                // Score text
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 20px Inter, sans-serif';
                ctx.fillText(`${t('scoreLabel')}: ${score}`, 15, 30);

                if (!gameOver) {
                    flappyAnimationId = requestAnimationFrame(loop);
                }
            }

            function endGame() {
                gameOver = true;
                isRunning = false;
                sounds.playGameOver();
                if (score > (state.highScores.flappy || 0)) {
                    state.highScores.flappy = score;
                    saveState();
                }
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#f59e0b';
                ctx.font = 'bold 26px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(t('gameOver'), canvas.width / 2, canvas.height / 2 - 10);
                ctx.fillStyle = '#ffffff';
                ctx.font = '16px Inter, sans-serif';
                ctx.fillText(`${t('scoreLabel')}: ${score}`, canvas.width / 2, canvas.height / 2 + 25);
            }

            loop();
        }
    </script>

        function launchMemoryGame() {

            const icons = ['fa-cpu', 'fa-database', 'fa-wifi', 'fa-display', 'fa-code', 'fa-[#python]', 'fa-keyboard', 'fa-hard-drive'];
            let cards = [...icons, ...icons].sort(() => Math.random() - 0.5);

            let flipped = [];
            let matched = [];
            let moves = 0;

            let html = `
                <div class="max-w-md mx-auto w-full glass p-6 rounded-3xl flex flex-col items-center gap-6 my-auto text-center relative">

                    <div id="memoryGrid" class="grid grid-cols-4 gap-3 w-full"></div>
                </div>
            `;
            container.innerHTML = html;

            const grid = document.getElementById('memoryGrid');

            function renderCards() {
                grid.innerHTML = '';
                cards.forEach((icon, idx) => {
                    const isFlipped = flipped.includes(idx) || matched.includes(idx);
                    const btn = document.createElement('button');
                    btn.className = `h-16 rounded-xl flex items-center justify-center text-2xl transition-all duration-300 ${
                        isFlipped ? 'bg-emerald-600 text-white shadow-lg rotate-0' : 'bg-slate-800 text-slate-800 border border-white/10 hover:border-emerald-400'
                    }`;
                    btn.innerHTML = isFlipped ? `<i class="fa-solid ${icon}"></i>` : `<i class="fa-solid fa-microchip text-slate-600"></i>`;
                    btn.onclick = () => onCardClick(idx);
                    grid.appendChild(btn);
                });
            }

            function onCardClick(idx) {
                if (flipped.length >= 2 || flipped.includes(idx) || matched.includes(idx)) return;

                sounds.playBeep(400, 'sine', 0.05);
                flipped.push(idx);
                renderCards();

                if (flipped.length === 2) {
                    moves++;
                    const [i1, i2] = flipped;
                    if (cards[i1] === cards[i2]) {
                        sounds.playCoin();
                        matched.push(i1, i2);
                        flipped = [];
                        renderCards();

                        if (matched.length === cards.length) {
                            sounds.playCorrect();
                            const score = Math.max(100 - moves * 5, 20);
                            if (score > (state.highScores.memory || 0)) {
                                state.highScores.memory = score;
                                saveState();
                            }
                            setTimeout(() => {
                                alert(`${t('congrats')} ${t('scoreLabel')}: ${score}`);
                                renderApp();
                            }, 300);
                        }
                    } else {
                        setTimeout(() => {
                            sounds.playWrong();
                            flipped = [];
                            renderCards();
                        }, 800);
                    }
                }
            }

            renderCards();
        }

    <script>
        let snakeInterval = null;
        function launchSnakeGame() {
            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="max-w-md mx-auto w-full glass p-6 rounded-3xl flex flex-col items-center gap-4 my-auto relative">
                    <button onclick="clearInterval(snakeInterval); renderApp();" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                    <h3 class="text-xl font-bold text-amber-400 flex items-center gap-2">
                        <i class="fa-solid fa-staff-snake"></i> ${t('gameTitle4')}
                    </h3>
                    <div class="text-xs text-slate-400">Tugmalar / Стрелки: ⬅️ ⬆️ ⬇️ ➡️</div>
                    <canvas id="snakeCanvas" width="300" height="300" class="bg-slate-900 rounded-2xl border border-white/10"></canvas>
                </div>
            `;

            const canvas = document.getElementById('snakeCanvas');
            const ctx = canvas.getContext('2d');

            const gridSize = 15;
            const tileCount = canvas.width / gridSize;

            let snake = [{ x: 10, y: 10 }];
            let food = { x: 5, y: 5, val: '1' };
            let dx = 1, dy = 0;
            let score = 0;

            function placeFood() {
                food.x = Math.floor(Math.random() * tileCount);
                food.y = Math.floor(Math.random() * tileCount);
                food.val = Math.random() > 0.5 ? '1' : '0';
            }

            window.onkeydown = (e) => {
                if (e.key === 'ArrowUp' && dy !== 1) { dx = 0; dy = -1; }
                if (e.key === 'ArrowDown' && dy !== -1) { dx = 0; dy = 1; }
                if (e.key === 'ArrowLeft' && dx !== 1) { dx = -1; dy = 0; }
                if (e.key === 'ArrowRight' && dx !== -1) { dx = 1; dy = 0; }
            };

            function gameStep() {
                const head = { x: snake[0].x + dx, y: snake[0].y + dy };

                // Collision detection
                if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                    return endGame();
                }
                for (let part of snake) {
                    if (part.x === head.x && part.y === head.y) return endGame();
                }

                snake.unshift(head);

                if (head.x === food.x && head.y === food.y) {
                    sounds.playCoin();
                    score += 10;
                    placeFood();
                } else {
                    snake.pop();
                }

                // Render Canvas
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Food
                ctx.fillStyle = '#f59e0b';
                ctx.font = 'bold 12px monospace';
                ctx.fillText(food.val, food.x * gridSize + 3, food.y * gridSize + 12);

                // Snake
                snake.forEach((part, idx) => {
                    ctx.fillStyle = idx === 0 ? '#10b981' : '#34d399';
                    ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 1, gridSize - 1);
                });
            }

            function endGame() {
                clearInterval(snakeInterval);
                sounds.playGameOver();
                if (score > (state.highScores.snake || 0)) {
                    state.highScores.snake = score;
                    saveState();
                }
                alert(`${t('gameOver')} ${t('scoreLabel')}: ${score}`);
                renderApp();
            }

            placeFood();
            if (snakeInterval) clearInterval(snakeInterval);
            snakeInterval = setInterval(gameStep, 120);
        }
    </script>

   START

function startCarGame() {

    const game = window.carGame;

    game.running = true;
    game.score = 0;
    game.coins = 0;
    game.lives = 3;
    game.speed = 2;
    game.roadOffset = 0;
    game.enemyTimer = 0;
    game.coinTimer = 0;

    game.player.x = 140;
    game.enemies = [];
    game.coinsList = [];

    document
        .getElementById('carStartScreen')
        .classList.add('hidden');

    document
        .getElementById('carGameOver')
        .classList.add('hidden');

    updateCarUI();

    if (carGameInterval) {
        cancelAnimationFrame(carGameInterval);
    }

    carGameLoop();
}


/* =========================
   MAIN LOOP
========================= */

function carGameLoop() {

    const game = window.carGame;

    if (!game.running) return;

    updateCarGame();
    drawCarScene();

    carGameInterval =
        requestAnimationFrame(carGameLoop);
}


/* =========================
   UPDATE
========================= */

function updateCarGame() {

    const game = window.carGame;

    game.roadOffset += game.speed;

    if (game.roadOffset > 80) {
        game.roadOffset = 0;
    }

    game.enemyTimer++;

    game.coinTimer++;

    /*
       Чем больше очков,
       тем быстрее игра
    */

    game.speed =
        4 + Math.min(
            game.score / 300,
            6
        );


    /* CREATE ENEMY */

    if (
        game.enemyTimer >
        Math.max(
            35,
            85 - game.speed * 5
        )
    ) {

        createEnemy();

        game.enemyTimer = 0;
    }


    /* CREATE COIN */

    if (game.coinTimer > 70) {

        createCoin();

        game.coinTimer = 0;
    }


    /* MOVE ENEMIES */

    game.enemies.forEach(enemy => {

        enemy.y += enemy.speed;
    });


    /* MOVE COINS */

    game.coinsList.forEach(coin => {

        coin.y += game.speed;
    });


    /* ENEMY COLLISION */

    for (let i = game.enemies.length - 1; i >= 0; i--) {

        const enemy = game.enemies[i];

        if (carCollision(
            game.player,
            enemy
        )) {

            game.enemies.splice(i, 1);

            game.lives--;

            updateCarUI();

            if (
                typeof sounds !== 'undefined' &&
                sounds.playGameOver
            ) {
                sounds.playGameOver();
            }

            if (game.lives <= 0) {

                endCarGame();

                return;
            }

            continue;
        }


        if (enemy.y > game.canvas.height + 100) {

            game.enemies.splice(i, 1);

            game.score += 10;

            updateCarUI();
        }
    }


    /* COIN COLLISION */

    for (
        let i = game.coinsList.length - 1;
        i >= 0;
        i--
    ) {

        const coin = game.coinsList[i];

        if (
            carCollision(
                game.player,
                {
                    x: coin.x - 10,
                    y: coin.y - 10,
                    width: 20,
                    height: 20
                }
            )
        ) {

            game.coinsList.splice(i, 1);

            game.coins++;

            game.score += 25;

            if (
                typeof sounds !== 'undefined' &&
                sounds.playCoin
            ) {
                sounds.playCoin();
            }

            updateCarUI();

            continue;
        }


        if (coin.y > game.canvas.height + 50) {

            game.coinsList.splice(i, 1);
        }
    }
}


/* =========================
   CREATE ENEMY
========================= */

function createEnemy() {

    const game = window.carGame;

    const lanes = [
        55,
        115,
        175,
        235
    ];

    const x =

function createCoin() {

/* =========================
   DRAW
========================= */

function drawCarScene() {

    const game = window.carGame;

    if (!game) return;

    const ctx = game.ctx;
    const canvas = game.canvas;

    /* SKY / GRASS */

    ctx.fillStyle = '#14532d';

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* GRASS DETAILS */

    for (
        let y = -30 + game.roadOffset % 60;
        y < canvas.height;
        y += 60
    ) {

        ctx.fillStyle = '#22c55e';

        ctx.fillRect(
            15,
            y,
            8,
            25
        );

        ctx.fillRect(
            295,
            y + 15,
            8,
            25
        );
    }


    /* ROAD */

    ctx.fillStyle = '#1f2937';

    ctx.fillRect(
        35,
        0,
        250,
        canvas.height
    );


    /* ROAD EDGES */

    ctx.fillStyle = '#facc15';

    ctx.fillRect(
        35,
        0,
        6,
        canvas.height
    );

    ctx.fillRect(
        279,
        0,
        6,
        canvas.height
    );


    /* ROAD LINES */

    ctx.fillStyle = '#f8fafc';

    for (
        let y = -80 + game.roadOffset;
        y < canvas.height;
        y += 80
    ) {

        ctx.fillRect(
            97,
            y,
            6,
            45
        );

        ctx.fillRect(
            158,
            y,
            6,
            45
        );

        ctx.fillRect(
            219,
            y,
            6,
            45
        );
    }


    /* COINS */

    game.coinsList.forEach(
        drawCoin
    );


    /* ENEMIES */

    game.enemies.forEach(
        drawEnemyCar
    );


    /* PLAYER */

    drawPlayerCar();
}


/* =========================
   PLAYER CAR
========================= */

function drawPlayerCar() {

    const game = window.carGame;

    const ctx = game.ctx;

    const car = game.player;


    /* SHADOW */

    ctx.fillStyle =
        'rgba(0,0,0,0.35)';

    ctx.beginPath();

    ctx.ellipse(
        car.x + 21,
        car.y + 72,
        25,
        7,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* WHEELS */

    ctx.fillStyle = '#020617';

    ctx.fillRect(
        car.x - 5,
        car.y + 12,
        8,
        22
    );

    ctx.fillRect(
        car.x + 39,
        car.y + 12,
        8,
        22
    );

    ctx.fillRect(
        car.x - 5,
        car.y + 43,
        8,
        22
    );

    ctx.fillRect(
        car.x + 39,
        car.y + 43,
        8,
        22
    );


    /* BODY */

    const gradient =
        ctx.createLinearGradient(
            car.x,
            car.y,
            car.x + 42,
            car.y
        );

    gradient.addColorStop(
        0,
        '#dc2626'
    );

    gradient.addColorStop(
        0.5,
        '#ef4444'
    );

    gradient.addColorStop(
        1,
        '#991b1b'
    );

    ctx.fillStyle = gradient;

    ctx.beginPath();

    ctx.roundRect(
        car.x,
        car.y,
        car.width,
        car.height,
        10
    );

    ctx.fill();


    /* WINDOWS */

    ctx.fillStyle = '#0f172a';

    ctx.beginPath();

    ctx.roundRect(
        car.x + 7,
        car.y + 10,
        28,
        25,
        7
    );

    ctx.fill();


    /* WINDOW REFLECTION */

    ctx.fillStyle =
        'rgba(125,211,252,0.65)';

    ctx.fillRect(
        car.x + 10,
        car.y + 13,
        9,
        4
    );


    /* HEADLIGHTS */

    ctx.fillStyle = '#fef08a';

    ctx.beginPath();

    ctx.roundRect(
        car.x + 5,
        car.y + 3,
        9,
        6,
        3
    );

    ctx.fill();

    ctx.beginPath();

    ctx.roundRect(
        car.x + 28,
        car.y + 3,
        9,
        6,
        3
    );

    ctx.fill();


    /* FRONT GRILL */

    ctx.fillStyle = '#450a0a';

    ctx.fillRect(
        car.x + 10,
        car.y + 57,
        22,
        5
    );
}


/* =========================
   ENEMY CAR
========================= */

function drawEnemyCar(enemy) {

    const ctx =
        window.carGame.ctx;


    /* WHEELS */

    ctx.fillStyle = '#020617';

    ctx.fillRect(
        enemy.x - 5,
        enemy.y + 12,
        8,
        22
    );

    ctx.fillRect(
        enemy.x + 39,
        enemy.y + 12,
        8,
        22
    );

    ctx.fillRect(
        enemy.x - 5,
        enemy.y + 43,
        8,
        22
    );

    ctx.fillRect(
        enemy.x + 39,
        enemy.y + 43,
        8,
        22
    );


    /* BODY */

    ctx.fillStyle =
        enemy.color;

    ctx.beginPath();

    ctx.roundRect(
        enemy.x,
        enemy.y,
        enemy.width,
        enemy.height,
        10
    );

    ctx.fill();


    /* WINDOWS */

    ctx.fillStyle =
        '#0f172a';

    ctx.beginPath();

    ctx.roundRect(
        enemy.x + 7,
        enemy.y + 10,
        28,
        25,
        7
    );

    ctx.fill();


    /* LIGHTS */

    ctx.fillStyle =
        '#ef4444';

    ctx.fillRect(
        enemy.x + 5,
        enemy.y + 58,
        9,
        6
    );

    ctx.fillRect(
        enemy.x + 28,
        enemy.y + 58,
        9,
        6
    );
}


/* =========================
   COIN
========================= */

function drawCoin(coin) {

    const ctx =
        window.carGame.ctx;

    ctx.beginPath();

    ctx.arc(
        coin.x,
        coin.y,
        coin.radius,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = '#facc15';

    ctx.fill();

    ctx.strokeStyle = '#f59e0b';

    ctx.lineWidth = 3;

    ctx.stroke();

    ctx.fillStyle = '#92400e';

    ctx.font =
        'bold 12px Arial';

    ctx.textAlign = 'center';

    ctx.textBaseline = 'middle';

    ctx.fillText(
        '$',
        coin.x,
        coin.y
    );

    ctx.textAlign = 'start';
}


/* =========================
   MOVE
========================= */

function carMove(direction) {

    const game = window.carGame;

    if (!game || !game.running) return;

    game.player.x +=
        direction * 28;

    if (game.player.x < 45) {

        game.player.x = 45;
    }

    if (
        game.player.x >
        233
    ) {

        game.player.x = 233;
    }
}


/* =========================
   COLLISION
========================= */

function carCollision(a, b) {

    return (
        a.x + 7 <
        b.x + b.width - 7 &&

        a.x + a.width - 7 >
        b.x + 7 &&

        a.y + 8 <
        b.y + b.height - 8 &&

        a.y + a.height - 8 >
        b.y + 8
    );
}


/* =========================
   UI
========================= */

function updateCarUI() {

    const game = window.carGame;

    document.getElementById(
        'carScore'
    ).textContent = game.score;

    document.getElementById(
        'carCoins'
    ).textContent = game.coins;

    document.getElementById(
        'carLives'
    ).textContent = game.lives;
}


/* =========================
   GAME OVER
========================= */

function endCarGame() {

    const game = window.carGame;

    game.running = false;

    if (carGameInterval) {

        cancelAnimationFrame(
            carGameInterval
        );

        carGameInterval = null;
    }


    /* SAVE HIGH SCORE */

    if (
        typeof state !== 'undefined' &&
        state.highScores
    ) {

        if (
            game.score >
            (state.highScores.car || 0)
        ) {

            state.highScores.car =
                game.score;

            if (
                typeof saveState === 'function'
            ) {
                saveState();
            }
        }
    }


    document.getElementById(
        'finalCarScore'
    ).textContent = game.score;

    document.getElementById(
        'finalCarCoins'
    ).textContent = game.coins;


    document
        .getElementById('carGameOver')
        .classList.remove('hidden');
}


/* =========================
   CLOSE
========================= */

function closeCarGame() {

    if (carGameInterval) {

        cancelAnimationFrame(
            carGameInterval
        );

        carGameInterval = null;
    }

    window.onkeydown = null;

    renderApp();
}
</script>

    <script>
        window.onload = function() {
            renderApp();
        };
    </script>
